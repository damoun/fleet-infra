---
# In-cluster search API for the Hermes gateway. Queries the public web only,
# never the LAN, cluster or NetBird.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng
  namespace: searxng
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hermes
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # Overrides the cluster baseline's kube-apiserver allow; this pod never needs it.
  # The special-use ranges keep it off the LAN, NetBird and the LB VIPs.
  egressDeny:
    - toEntities:
        - kube-apiserver
    - toCIDRSet:
        - cidr: 0.0.0.0/8
        - cidr: 10.0.0.0/8
        - cidr: 100.64.0.0/10
        - cidr: 127.0.0.0/8
        - cidr: 169.254.0.0/16
        - cidr: 172.16.0.0/12
        - cidr: 192.0.0.0/24
        - cidr: 192.168.0.0/16
        - cidr: 198.18.0.0/15
        - cidr: 224.0.0.0/4
        - cidr: 240.0.0.0/4
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
