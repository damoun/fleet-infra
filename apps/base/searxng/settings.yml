# Private instance for in-cluster API clients; secret_key comes from SEARXNG_SECRET.
use_default_settings: true
# Wikimedia and OSM engines refuse to load without a contact.
general:
  contact_url: https://github.com/damoun/fleet-infra
server:
  limiter: false
  public_instance: false
  image_proxy: false
search:
  formats:
    - html
    - json
outgoing:
  request_timeout: 5.0
# Off upstream; more engines answering raises the score of results they agree on.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
