# Private instance for in-cluster API clients; secret_key comes from SEARXNG_SECRET.
use_default_settings: true
# Wikimedia and OSM engines refuse to load without a contact.
general:
  contact_url: https://github.com/damoun/fleet-infra
search:
  formats:
    - html
    - json
outgoing:
  request_timeout: 5.0
engines:
  # Off upstream because solving its proof-of-work CAPTCHA costs CPU.
  - name: mojeek
    inactive: false
  # Intermittently returns cloaked /go/v1/ links instead of result URLs (searxng#6967).
  - name: brave
    disabled: true
