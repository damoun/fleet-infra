---
# Only Hermes reaches the server. Outbound is IMAPS to the public internet,
# never the LAN, cluster or NetBird.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: imap-mcp
  namespace: imap-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: imap-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hermes
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
  egressDeny:
    - toEntities:
        - kube-apiserver
    - toCIDRSet:
        - cidr: 0.0.0.0/8
        - cidr: 10.0.0.0/8
        - cidr: 100.64.0.0/10
        - cidr: 127.0.0.0/8
        - cidr: 169.254.0.0/16
        - cidr: 172.16.0.0/12
        - cidr: 192.0.0.0/24
        - cidr: 192.168.0.0/16
        - cidr: 198.18.0.0/15
        - cidr: 224.0.0.0/4
        - cidr: 240.0.0.0/4
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "993"
              protocol: TCP
