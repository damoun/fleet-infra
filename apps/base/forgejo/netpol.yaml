---
# The UI is reached through the gateway. Mirrors pull from GitHub only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo
  namespace: forgejo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Break-glass: Flux syncs from Forgejo while GitHub is down.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
            app: source-controller
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  # Overrides the cluster baseline's kube-apiserver allow; this pod never needs it.
  egressDeny:
    - toEntities:
        - kube-apiserver
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: forgejo-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Login with Pocket ID goes through the Gateway, and Cilium's Envoy checks
    # the client's egress against the backend pod.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: id
            app.kubernetes.io/name: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchPattern: "*.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: forgejo-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: forgejo
        - matchLabels:
            cnpg.io/cluster: forgejo-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The operator and the other instance poll each instance manager's status endpoint.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
        - matchLabels:
            cnpg.io/cluster: forgejo-db
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # Streaming replication and status polling between the instances.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: forgejo-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
