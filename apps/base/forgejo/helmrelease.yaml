---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  releaseName: forgejo
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: flux-system
  # deployment.labels also lands in the immutable selector, and the chart has no
  # automount or service links values.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: forgejo
            patch: |
              # Opts the pod into Gateway traffic from the NetBird routers.
              - op: add
                path: /spec/template/metadata/labels/edge.damoun.casa~1exposed
                value: "true"
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              - op: add
                path: /spec/template/spec/enableServiceLinks
                value: false
  values:
    global:
      # The Pocket ID issuer only resolves in NetBird DNS.
      hostAliases:
        - ip: 172.28.0.10
          hostnames:
            - id.core.ams.damoun.casa
    # The chart appends -rootless after a digest in tag, so the pinned ref goes
    # in fullOverride, tracked by a Renovate custom manager.
    image:
      fullOverride: code.forgejo.org/forgejo/forgejo:15.0.11-rootless@sha256:3cd6bc2b74c87cbde0a0fd527c9665cb416f5a0540dee54fe5afb3fa2df9f40c
      rootless: true
    strategy:
      type: Recreate
    test:
      enabled: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
    initContainers:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    persistence:
      claimName: forgejo-data
      storageClass: local-retain
      size: 5Gi
    gitea:
      # Break-glass login when Pocket ID is down.
      admin:
        existingSecret: forgejo-admin
        passwordMode: initialOnlyNoReset
      oauth:
        - name: pocket-id
          provider: openidConnect
          existingSecret: forgejo-oidc
          autoDiscoverUrl: https://id.core.ams.damoun.casa/.well-known/openid-configuration
          scopes: openid,email,profile,groups
          groupClaimName: groups
          adminGroup: forgejo_admins
      config:
        server:
          DOMAIN: git.core.ams.damoun.casa
          ROOT_URL: https://git.core.ams.damoun.casa/
          DISABLE_SSH: true
          START_SSH_SERVER: false
        # Accounts only come from Pocket ID; Forgejo asks for a username on first login.
        service:
          DISABLE_REGISTRATION: false
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          SHOW_REGISTRATION_BUTTON: false
        mirror:
          DEFAULT_INTERVAL: 10m
