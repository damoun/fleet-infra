---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 5Gi
---
# hostNetwork gives full mDNS/SSDP discovery. The local-retain PV pins the pod to its node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
        edge.damoun.casa/exposed: "true"
    # The image runs s6-overlay as root.
    spec: # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostNetwork: true # nosemgrep: yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod
      dnsPolicy: ClusterFirstWithHostNet
      # The Pocket ID issuer only resolves in NetBird DNS.
      hostAliases:
        - ip: 172.28.0.10
          hostnames:
            - id.core.ams.damoun.casa
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: init
          image: ghcr.io/home-assistant/home-assistant:2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
          command:
            - /bin/sh
            - -ec
            - |
              cd /config
              cp /etc/home-assistant/configuration.yaml configuration.yaml
              # Home Assistant only creates these with its own default
              # configuration.yaml, which this one replaces.
              [ -e automations.yaml ] || echo '[]' > automations.yaml
              touch scripts.yaml scenes.yaml
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /etc/home-assistant
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
          env:
            - name: TZ
              value: Europe/Amsterdam
            # Read by the recorder through `db_url: !env_var DB_URL`.
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: home-assistant-db-app
                  key: uri
            # Read by the auth_oidc custom component through `!env_var`.
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: home-assistant-oidc
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: home-assistant-oidc
                  key: OIDC_CLIENT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8123
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant
        - name: configuration
          configMap:
            name: home-assistant-config
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
