---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-db
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: immich-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich
        - matchLabels:
            cnpg.io/cluster: immich-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The operator and the other instance poll each instance manager's status endpoint.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
        - matchLabels:
            cnpg.io/cluster: immich-db
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # Streaming replication and status polling between the instances.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: immich-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-valkey
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich-valkey
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
  egressDeny:
    - toEntities:
        - kube-apiserver
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-ml
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich-ml
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
  egressDeny:
    - toEntities:
        - kube-apiserver
  egress:
    # Models download from Hugging Face on first use; the large files are
    # served from the xet CDN under hf.co.
    - toFQDNs:
        - matchName: huggingface.co
        - matchPattern: "*.huggingface.co"
        - matchName: hf.co
        - matchPattern: "*.hf.co"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
