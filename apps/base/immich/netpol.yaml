---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-db
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: immich-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich
        - matchLabels:
            cnpg.io/cluster: immich-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The operator and the other instance poll each instance manager's status endpoint.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
        - matchLabels:
            cnpg.io/cluster: immich-db
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # Streaming replication and status polling between the instances.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: immich-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
