---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
        edge.damoun.casa/exposed: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The Pocket ID issuer only resolves in NetBird DNS.
      hostAliases:
        - ip: 172.28.0.10
          hostnames:
            - id.core.ams.damoun.casa
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
          env:
            - name: TZ
              value: Europe/Amsterdam
            # Settings are owned by Git; the file holds the OAuth client secret.
            - name: IMMICH_CONFIG_FILE
              value: /config/immich.json
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: uri
            - name: REDIS_HOSTNAME
              value: immich-valkey
          ports:
            - name: http
              containerPort: 2283
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            # 4K HEVC software transcodes share this container with the API; an OOM drops uploads.
            limits:
              memory: 6Gi
          volumeMounts:
            - name: library
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
        - name: config
          secret:
            secretName: immich-config
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich
  ports:
    - name: http
      port: 2283
      targetPort: http
