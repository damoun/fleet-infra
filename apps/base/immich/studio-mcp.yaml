---
# Renders reels and carousels from Immich assets (images/studio-mcp). It holds
# the Immich API key, so Hermes holds no credential. Jobs live in memory, so
# one replica only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-mcp
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: studio-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/damoun/studio-mcp:main@sha256:d556470fc23ed6d6c70bcdeff106a90d5e5eae889070cd82e76e0cf27ef7b730
          env:
            - name: IMMICH_URL
              value: http://immich.immich.svc.cluster.local:2283/api
            - name: WORK_DIR
              value: /work
          envFrom:
            - secretRef:
                name: studio-mcp
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # ffmpeg opens one 4K HEVC decoder per reel segment.
            limits:
              memory: 4Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        # Originals for one job at a time, plus the render. Wiped with the pod,
        # so a job killed mid-render leaves nothing behind.
        - name: work
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: studio-mcp
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: studio-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
