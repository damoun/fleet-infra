---
# Karakeep's official MCP server behind supergateway (images/karakeep-mcp).
# It holds the API key, so Hermes holds no credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-mcp
  namespace: karakeep
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karakeep-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karakeep-mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/damoun/karakeep-mcp:main@sha256:dc638eac0e8667608efbf02d2301a4f9f1b01a46bb5ba81671c8c4e2ac1027b0
          env:
            - name: KARAKEEP_API_ADDR
              value: http://karakeep.karakeep.svc.cluster.local:3000
          envFrom:
            - secretRef:
                name: karakeep-mcp
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            # Each session runs its own karakeep-mcp process for up to 15 minutes.
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-mcp
  namespace: karakeep
spec:
  selector:
    app.kubernetes.io/name: karakeep-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
