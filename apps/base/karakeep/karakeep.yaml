---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep
  namespace: karakeep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: karakeep
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karakeep
        edge.damoun.casa/exposed: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The Pocket ID issuer only resolves in NetBird DNS.
      hostAliases:
        - ip: 172.28.0.10
          hostnames:
            - id.core.ams.damoun.casa
      containers:
        - name: karakeep
          image: ghcr.io/karakeep-app/karakeep:0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
          env:
            - name: DATA_DIR
              value: /data
            - name: NEXTAUTH_URL
              value: https://keep.core.ams.damoun.casa
            - name: MEILI_ADDR
              value: http://meilisearch:7700
            - name: BROWSER_WEB_URL
              value: http://karakeep-chrome:9222
            - name: OAUTH_WELLKNOWN_URL
              value: https://id.core.ams.damoun.casa/.well-known/openid-configuration
            - name: OAUTH_PROVIDER_NAME
              value: Pocket ID
            - name: DISABLE_PASSWORD_AUTH
              value: "true"
            # DISABLE_SIGNUPS also blocks the first OIDC login, so Pocket ID
            # decides who gets an account.
          envFrom:
            - secretRef:
                name: karakeep
            - secretRef:
                name: karakeep-oidc
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 640Mi
            limits:
              memory: 1280Mi
          volumeMounts:
            - name: data
              mountPath: /data
            # s6-overlay runs its supervision tree from /run.
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: karakeep
spec:
  selector:
    app.kubernetes.io/name: karakeep
  ports:
    - name: http
      port: 3000
      targetPort: http
