---
# Headless Chrome for the crawler. It keeps no state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-chrome
  namespace: karakeep
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karakeep-chrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karakeep-chrome
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Upstream runs it with init: true; the pause container reaps Chrome's zombies.
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chrome
          image: ghcr.io/karakeep-app/karakeep-chrome:157.0.8103.38-r1@sha256:6c80ed470871bb8c129dc58692ca1714cddbc1392faad3ebf59aecd2e6e58eac
          # The entrypoint owns the DevTools port and --no-sandbox; these are upstream's extra flags.
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
            - --disable-blink-features=AutomationControlled
            - --window-size=1440,900
          ports:
            - name: devtools
              containerPort: 9222
          readinessProbe:
            tcpSocket:
              port: devtools
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-chrome
  namespace: karakeep
spec:
  selector:
    app.kubernetes.io/name: karakeep-chrome
  ports:
    - name: devtools
      port: 9222
      targetPort: devtools
