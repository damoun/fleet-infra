---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camofox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: camofox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: camofox
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: camofox
          image: ghcr.io/damoun/camofox:main@sha256:e4321c1fc0dbf0f6ded7c4d6552625bcc267a8203992967e9db9b4c1206d29dd
          env:
            # The server copies the browser binary to /tmp and runs it from there.
            - name: HOME
              value: /tmp
            # Crash reports are filed as public GitHub issues.
            - name: CAMOFOX_CRASH_REPORT_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 9377
          readinessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: camofox
spec:
  selector:
    app.kubernetes.io/name: camofox
  ports:
    - name: http
      port: 9377
      targetPort: http
---
# Holds no secrets: public internet only, never the LAN, cluster or NetBird.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: camofox
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: camofox
  # Overrides the cluster baseline's kube-apiserver allow; this pod never needs it.
  # The special-use ranges keep the browser off the LAN, NetBird and the LB VIPs.
  egressDeny:
    - toEntities:
        - kube-apiserver
    - toCIDRSet:
        - cidr: 0.0.0.0/8
        - cidr: 10.0.0.0/8
        - cidr: 100.64.0.0/10
        - cidr: 127.0.0.0/8
        - cidr: 169.254.0.0/16
        - cidr: 172.16.0.0/12
        - cidr: 192.0.0.0/24
        - cidr: 192.168.0.0/16
        - cidr: 198.18.0.0/15
        - cidr: 224.0.0.0/4
        - cidr: 240.0.0.0/4
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "9377"
              protocol: TCP
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
