---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox
        egress.damoun.casa/client: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox
          image: ghcr.io/damoun/hermes-sandbox:main@sha256:9bb1a7e3019d1448b4ad9710245fb37a6a194138f909391cf4a281667385d41f
          env:
            - name: SSH_SETENV
              value: HTTPS_PROXY HTTP_PROXY NO_PROXY SSL_CERT_FILE CURL_CA_BUNDLE REQUESTS_CA_BUNDLE NODE_EXTRA_CA_CERTS
            - name: HTTPS_PROXY
              value: http://egress-proxy.hermes.svc.cluster.local:8080
            - name: HTTP_PROXY
              value: http://egress-proxy.hermes.svc.cluster.local:8080
            - name: NO_PROXY
              value: localhost,127.0.0.1
            - name: SSL_CERT_FILE
              value: /etc/egress-ca/ca.crt
            - name: CURL_CA_BUNDLE
              value: /etc/egress-ca/ca.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/egress-ca/ca.crt
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/egress-ca/ca.crt
          ports:
            - name: ssh
              containerPort: 2222
          readinessProbe:
            tcpSocket:
              port: ssh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run/sshd
            - name: authorized-keys
              mountPath: /etc/ssh/authorized_keys
              readOnly: true
            - name: host-key
              mountPath: /etc/ssh/host
              readOnly: true
            - name: egress-ca
              mountPath: /etc/egress-ca
              readOnly: true
      volumes:
        # Workspace is wiped on every restart.
        - name: home
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: authorized-keys
          configMap:
            name: hermes-sandbox-authorized-keys
        - name: host-key
          secret:
            secretName: hermes-sandbox-host-key
        - name: egress-ca
          secret:
            secretName: egress-proxy-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
spec:
  selector:
    app.kubernetes.io/name: sandbox
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
---
# No egress besides the proxy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sandbox
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox
  # Overrides the cluster baseline's kube-apiserver allow; this pod never needs it.
  egressDeny:
    - toEntities:
        - kube-apiserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-sandbox-authorized-keys
data:
  authorized_keys: |
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINlka8szyZWbWBrszlDFv+xccKd0TLgi1A0JyfGDT2aU hermes-gateway
