---
# Read-only snapshot shared with the sandbox, which mounts it read-only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bank-sync
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 256Mi
---
# PSD2 account information only: the sessions carry no payment scope.
# Every 6h stays within the 4 unattended refreshes a day banks allow.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bank-sync
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bank-sync
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          # Same uid as the sandbox, which reads the snapshot.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            # The sandbox image already ships cryptography for the JWT signature.
            - name: bank-sync
              image: ghcr.io/damoun/hermes-sandbox:main@sha256:2be100caf002f946b5d38b8069cecaca4a3bae786421886e6c642e460c702ac2
              command:
                - python
                - /opt/bank-sync/sync.py
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /opt/bank-sync
                  readOnly: true
                - name: secrets
                  mountPath: /etc/bank-sync
                  readOnly: true
                - name: data
                  mountPath: /data
          volumes:
            - name: script
              configMap:
                name: bank-sync
            - name: secrets
              secret:
                secretName: bank-sync
                defaultMode: 0440
            - name: data
              persistentVolumeClaim:
                claimName: bank-sync
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bank-sync
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bank-sync
  # Overrides the cluster baseline's kube-apiserver allow; this pod never needs it.
  egressDeny:
    - toEntities:
        - kube-apiserver
  egress:
    - toFQDNs:
        - matchName: api.enablebanking.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
