---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - egress-proxy-config.yaml
  - egress-proxy-secret.yaml
  - egress-proxy-netpol.yaml
  - signal-secret.yaml
  - gateway-ssh-secret.yaml
  - sandbox-host-key-secret.yaml
  - gateway.yaml
  - sandbox.yaml
  - browser.yaml
  - signal.yaml
components:
  - ../../components/egress-proxy
# Hashed name: a config change rolls the gateway, which copies it in at start.
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml=hermes-config.yaml
