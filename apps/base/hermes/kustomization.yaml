---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - egress-proxy-secret.yaml
  - egress-proxy-netpol.yaml
  - gateway-ssh-secret.yaml
  - sandbox-host-key-secret.yaml
  - gateway.yaml
  - dashboard.yaml
  - httproute.yaml
  - sandbox.yaml
  - camofox.yaml
  - obsidian-secret.yaml
  - obsidian.yaml
  - alerts.yaml
components:
  - ../../components/egress-proxy
# Hashed names: a config change rolls the pod that reads it at start.
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml=hermes-config.yaml
      - merge.py=profiles/merge.py
      - default.yaml=profiles/default.yaml
      - profile-family.yaml=profiles/family.yaml
      - profile-vve.yaml=profiles/vve.yaml
      - profile-content.yaml=profiles/content.yaml
      - profile-vexa.yaml=profiles/vexa.yaml
      - profile-ops.yaml=profiles/ops.yaml
      - deepseek.env=profiles/deepseek.env
      - vve.env=profiles/vve.env
  - name: egress-proxy
    files:
      - proxy.yaml=egress-proxy.yaml
  - name: obsidian-npm
    files:
      - obsidian/package.json
      - obsidian/package-lock.json
