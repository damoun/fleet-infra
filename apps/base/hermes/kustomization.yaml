---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - egress-proxy-secret.yaml
  - egress-proxy-netpol.yaml
  - signal-secret.yaml
  - gateway-ssh-secret.yaml
  - sandbox-host-key-secret.yaml
  - gateway.yaml
  - httproute.yaml
  - sandbox.yaml
  - browser.yaml
  - signal.yaml
  - obsidian-secret.yaml
  - obsidian.yaml
  - alerts.yaml
components:
  - ../../components/egress-proxy
# Hashed names: a config change rolls the pod that reads it at start.
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml=hermes-config.yaml
  - name: egress-proxy
    files:
      - proxy.yaml=egress-proxy.yaml
  - name: obsidian-npm
    files:
      - obsidian/package.json
      - obsidian/package-lock.json
