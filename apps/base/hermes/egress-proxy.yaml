transforms:
  - name: allowlist
    config:
      # Any host; egress-proxy-upstreams keeps the proxy off private ranges.
      domains:
        - "*"
  - name: secrets
    config:
      secrets:
        - source:
            type: file
            path: /etc/iron-proxy/secrets/deepseek
          replace:
            proxy_value: proxy-deepseek
            match_headers:
              - Authorization
            require: true
          # The bare CONNECT carries no credential; check the requests inside the tunnel.
          rules:
            - host: api.deepseek.com
              methods:
                - GET
                - POST
        - source:
            type: file
            path: /etc/iron-proxy/secrets/gemini
          replace:
            proxy_value: proxy-gemini
            # Hermes' generic model listing sends the key as a Bearer token.
            match_headers:
              - x-goog-api-key
              - Authorization
            # The dashboard checks the key with ?key= on /v1beta/models.
            match_query: true
            require: true
          rules:
            - host: generativelanguage.googleapis.com
              methods:
                - GET
                - POST
        - source:
            type: file
            path: /etc/iron-proxy/secrets/mistral
          replace:
            proxy_value: proxy-mistral
            match_headers:
              - Authorization
            require: true
          rules:
            - host: api.eu.mistral.ai
              methods:
                - GET
                - POST
        - source:
            type: file
            path: /etc/iron-proxy/secrets/claude
          replace:
            # Shaped like an OAuth token: Hermes probes Anthropic /v1/models with
            # x-api-key for anything else.
            proxy_value: sk-ant-oat01-proxy-claude
            match_headers:
              - Authorization
            require: true
          rules:
            - host: api.anthropic.com
              methods:
                - GET
                - POST
        - source:
            type: file
            path: /etc/iron-proxy/secrets/meta
          replace:
            proxy_value: proxy-meta
            # The Graph API takes the token as ?access_token=.
            match_query: true
            require: true
          # Instagram account nodes only (their IDs start with 17841), read only:
          # /me, the Page or debug_token would hand the real token back.
          rules:
            - host: graph.facebook.com
              methods:
                - GET
              paths:
                - /v27.0/17841*
