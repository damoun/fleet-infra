transforms:
  - name: allowlist
    config:
      domains:
        - api.deepseek.com
        - generativelanguage.googleapis.com
        # Hermes' keyless web search ring: anonymous free tiers, no credential.
        - mcp.exa.ai
        - search.parallel.ai
        - api.firecrawl.dev
        - api.keenable.ai
        # maps skill: OpenStreetMap community services (fair use).
        - nominatim.openstreetmap.org
        - overpass-api.de
        - router.project-osrm.org
        # youtube-content skill: transcripts.
        - www.youtube.com
  - name: secrets
    config:
      secrets:
        - source:
            type: file
            path: /etc/iron-proxy/secrets/deepseek
          replace:
            proxy_value: proxy-deepseek
            match_headers:
              - Authorization
            require: true
          # The bare CONNECT carries no credential; check the requests inside the tunnel.
          rules:
            - host: api.deepseek.com
              methods:
                - GET
                - POST
        - source:
            type: file
            path: /etc/iron-proxy/secrets/gemini
          replace:
            proxy_value: proxy-gemini
            match_headers:
              - x-goog-api-key
            require: true
          rules:
            - host: generativelanguage.googleapis.com
              methods:
                - GET
                - POST

