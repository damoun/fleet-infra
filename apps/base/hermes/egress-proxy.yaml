transforms:
  - name: allowlist
    config:
      # Any host; egress-proxy-upstreams keeps the proxy off private ranges.
      domains:
        - "*"
  - name: secrets
    config:
      secrets:
        - source:
            type: file
            path: /etc/iron-proxy/secrets/deepseek
          replace:
            proxy_value: proxy-deepseek
            match_headers:
              - Authorization
            require: true
          # The bare CONNECT carries no credential; check the requests inside the tunnel.
          rules:
            - host: api.deepseek.com
              methods:
                - GET
                - POST
        - source:
            type: file
            path: /etc/iron-proxy/secrets/gemini
          replace:
            proxy_value: proxy-gemini
            match_headers:
              - x-goog-api-key
            require: true
          rules:
            - host: generativelanguage.googleapis.com
              methods:
                - GET
                - POST
