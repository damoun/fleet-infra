---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        egress.damoun.casa/client: "true"
    spec:
      automountServiceAccountToken: false
      # Python runs as PID 1 without an init; let the pause container reap
      # ssh and browser driver children.
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      # Replaces the image's s6 stage2 setup, which needs root.
      initContainers:
        - name: init
          image: ghcr.io/damoun/hermes-agent:main@sha256:da698ea10d9b9730fc9a1a924fbec54abe7725fc8e1747dc84fd1134dd55d8df
          command:
            - /bin/sh
            - -ec
            - |
              cd /opt/data
              mkdir -p backups cron sessions logs/gateways hooks memories skills skins plans workspace home pairing platforms/pairing .ssh
              cp /etc/hermes-config/config.yaml config.yaml
              install -m 0600 /etc/hermes-ssh/id_ed25519 .ssh/id_ed25519
              install -m 0644 /etc/hermes-ssh/known_hosts .ssh/known_hosts
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /etc/hermes-config
              readOnly: true
            - name: ssh
              mountPath: /etc/hermes-ssh
              readOnly: true
      containers:
        - name: hermes
          image: ghcr.io/damoun/hermes-agent:main@sha256:da698ea10d9b9730fc9a1a924fbec54abe7725fc8e1747dc84fd1134dd55d8df
          command:
            - /opt/hermes/.venv/bin/hermes
            - gateway
            - run
          workingDir: /opt/data
          env:
            - name: HOME
              value: /opt/data
            - name: HERMES_GATEWAY_NO_SUPERVISE
              value: "1"
            - name: XDG_RUNTIME_DIR
              value: /tmp
            - name: TMPDIR
              value: /tmp
            # Every upstream goes through the egress proxy, which presents
            # certificates from its own CA only.
            - name: HTTPS_PROXY
              value: http://egress-proxy.hermes.svc.cluster.local:8080
            - name: NO_PROXY
              value: localhost,127.0.0.1,.cluster.local,172.24.0.222
            - name: SSL_CERT_FILE
              value: /etc/egress-ca/ca.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/egress-ca/ca.crt
            - name: CURL_CA_BUNDLE
              value: /etc/egress-ca/ca.crt
            # Dummy tokens, swapped for the real keys by the egress proxy.
            - name: DEEPSEEK_API_KEY
              value: proxy-deepseek
            - name: GEMINI_API_KEY
              value: proxy-gemini
            - name: SIGNAL_HTTP_URL
              value: http://signal-cli.hermes.svc.cluster.local:8080
          envFrom:
            - secretRef:
                name: hermes-signal
          securityContext: *securityContext
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: egress-ca
              mountPath: /etc/egress-ca
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: config
          configMap:
            name: hermes-config
        - name: ssh
          secret:
            secretName: hermes-gateway-ssh
        - name: egress-ca
          secret:
            secretName: egress-proxy-ca
            items:
              - key: ca.crt
                path: ca.crt
---
# Proxy egress comes from egress-proxy-clients (component); the rest is here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  # Overrides the cluster baseline's kube-apiserver allow; this pod never needs it.
  egressDeny:
    - toEntities:
        - kube-apiserver
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: signal-cli
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: sandbox
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: browser
      toPorts:
        - ports:
            - port: "9222"
              protocol: TCP
