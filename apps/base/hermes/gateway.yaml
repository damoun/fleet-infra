---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        egress.damoun.casa/client: "true"
        edge.damoun.casa/exposed: "true"
    spec:
      automountServiceAccountToken: false
      # The Pocket ID issuer only resolves in NetBird DNS.
      hostAliases:
        - ip: 172.28.0.10
          hostnames:
            - id.core.ams.damoun.casa
      # Python runs as PID 1 without an init; let the pause container reap
      # ssh children.
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      # Replaces the image's s6 stage2 setup, which needs root.
      initContainers:
        - name: init
          image: &image ghcr.io/damoun/hermes-agent:main@sha256:b053e3312daf474c083a4bf5ebf7019ae9d8e65901a1a0734b33cbaf5471b02e
          command:
            - /bin/sh
            - -ec
            - |
              # Hermes refuses a control socket in a home it does not own, and
              # local-path creates the volume root as root 0777. The home is a
              # subdirectory instead.
              mkdir -p -m 0700 /vol/hermes
              cd /vol/hermes
              mkdir -p backups cron sessions logs/gateways hooks memories skills skins plans workspace home pairing platforms/pairing plugins .ssh
              # Each profile is the base config plus its overlay. Personas,
              # memories and cron belong to the profiles and stay untouched.
              cd /etc/hermes-config
              /opt/hermes/.venv/bin/python merge.py config.yaml default.yaml > /vol/hermes/config.yaml
              for overlay in profile-*.yaml; do
                name=${overlay#profile-}
                name=${name%.yaml}
                home=/vol/hermes/profiles/$name
                mkdir -p "$home"
                (cd "$home" && mkdir -p memories sessions skills skins logs plans workspace cron home)
                /opt/hermes/.venv/bin/python merge.py config.yaml "$overlay" > "$home/config.yaml"
                env=profile.env
                [ -f "$name.env" ] && env=$name.env
                install -m 0600 "$env" "$home/.env"
              done
              cd /vol/hermes
              rm -rf plugins/hermex-push
              cp -r /opt/hermex-push plugins/hermex-push
              install -m 0600 /etc/hermes-ssh/id_ed25519 .ssh/id_ed25519
              install -m 0644 /etc/hermes-ssh/known_hosts .ssh/known_hosts
              # The dashboard reaches Pocket ID directly (public certificate)
              # and everything else through the proxy (its own CA).
              cat /etc/ssl/certs/ca-certificates.crt /etc/egress-ca/ca.crt > /etc/ca-bundle/ca.crt
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /vol
            - name: config
              mountPath: /etc/hermes-config
              readOnly: true
            - name: ssh
              mountPath: /etc/hermes-ssh
              readOnly: true
            - name: egress-ca
              mountPath: /etc/egress-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ca-bundle
      containers:
        - name: hermes
          image: *image
          command:
            - /opt/hermes/.venv/bin/hermes
            - gateway
            - run
          workingDir: /opt/data
          env:
            - name: HOME
              value: /opt/data
            - name: HERMES_GATEWAY_NO_SUPERVISE
              value: "1"
            - name: XDG_RUNTIME_DIR
              value: /tmp
            - name: TMPDIR
              value: /tmp
            # Every upstream goes through the egress proxy, which presents
            # certificates from its own CA only.
            - name: HTTPS_PROXY
              value: http://egress-proxy.hermes.svc.cluster.local:8080
            - name: NO_PROXY
              value: localhost,127.0.0.1,.cluster.local
            - name: SSL_CERT_FILE
              value: /etc/egress-ca/ca.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/egress-ca/ca.crt
            - name: CURL_CA_BUNDLE
              value: /etc/egress-ca/ca.crt
            # Claude Code is not Python; it reads its extra CA from here.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/egress-ca/ca.crt
            # Dummy tokens, swapped for the real keys by the egress proxy.
            - name: DEEPSEEK_API_KEY
              value: proxy-deepseek
            - name: GEMINI_API_KEY
              value: proxy-gemini
            - name: CLAUDE_CODE_OAUTH_TOKEN
              value: sk-ant-oat01-proxy-claude
            - name: CAMOFOX_URL
              value: http://camofox.hermes.svc.cluster.local:9377
            - name: SEARXNG_URL
              value: http://searxng.searxng.svc.cluster.local:8080
            - name: HERMEX_PUSH_RELAY_URL
              value: https://hermex-relay.hermex-relay.workers.dev
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-webhook
                  key: WEBHOOK_SECRET
          ports:
            - name: webhook
              containerPort: 8644
          securityContext: *securityContext
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
              subPath: hermes
            - name: tmp
              mountPath: /tmp
            - name: egress-ca
              mountPath: /etc/egress-ca
              readOnly: true
        # Hermex chats run their turns in the dashboard process, so it needs the
        # same LLM, proxy, sandbox and MCP reach as the gateway.
        - name: dashboard
          image: *image
          command:
            - /opt/hermes/.venv/bin/hermes
            - dashboard
            - --host
            - 0.0.0.0
            - --port
            - "9119"
            - --no-open
            - --skip-build
          workingDir: /opt/data
          env:
            - name: HOME
              value: /opt/data
            - name: XDG_RUNTIME_DIR
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: HTTPS_PROXY
              value: http://egress-proxy.hermes.svc.cluster.local:8080
            - name: NO_PROXY
              value: localhost,127.0.0.1,.cluster.local,id.core.ams.damoun.casa
            - name: SSL_CERT_FILE
              value: /etc/ca-bundle/ca.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ca-bundle/ca.crt
            - name: CURL_CA_BUNDLE
              value: /etc/ca-bundle/ca.crt
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ca-bundle/ca.crt
            - name: DEEPSEEK_API_KEY
              value: proxy-deepseek
            - name: GEMINI_API_KEY
              value: proxy-gemini
            - name: CLAUDE_CODE_OAUTH_TOKEN
              value: sk-ant-oat01-proxy-claude
            - name: CAMOFOX_URL
              value: http://camofox.hermes.svc.cluster.local:9377
            - name: SEARXNG_URL
              value: http://searxng.searxng.svc.cluster.local:8080
            - name: HERMEX_PUSH_RELAY_URL
              value: https://hermex-relay.hermex-relay.workers.dev
          ports:
            - name: http
              containerPort: 9119
          readinessProbe:
            tcpSocket:
              port: http
          securityContext: *securityContext
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
              subPath: hermes
            - name: dashboard-tmp
              mountPath: /tmp
            - name: ca-bundle
              mountPath: /etc/ca-bundle
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: dashboard-tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: ca-bundle
          emptyDir:
            sizeLimit: 2Mi
        - name: config
          configMap:
            name: hermes-config
        - name: ssh
          secret:
            secretName: hermes-gateway-ssh
        - name: egress-ca
          secret:
            secretName: egress-proxy-ca
            items:
              - key: ca.crt
                path: ca.crt
---
# Proxy egress comes from egress-proxy-clients (component); the rest is here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  # Overrides the cluster baseline's kube-apiserver allow; this pod never needs it.
  egressDeny:
    - toEntities:
        - kube-apiserver
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9119"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports:
            - port: "8644"
              protocol: TCP
  egress:
    # Dashboard login with Pocket ID goes through the Gateway, and Cilium's
    # Envoy checks the client's egress against the backend pod.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: id
            app.kubernetes.io/name: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: sandbox
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: camofox
      toPorts:
        - ports:
            - port: "9377"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: notes-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Sure's MCP, through the injector that holds its token.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: sure
            app.kubernetes.io/name: mcp-auth
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Paperless's MCP, through the injector that holds the Hermes user's token.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: paperless
            app.kubernetes.io/name: mcp-auth
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Karakeep's MCP, which holds the API key.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: karakeep
            app.kubernetes.io/name: karakeep-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Mealie's MCP, which holds the Hermes user's token.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mealie
            app.kubernetes.io/name: mealie-mcp
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
    # Immich's studio MCP, which holds the Immich API key.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: immich
            app.kubernetes.io/name: studio-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Read-only VictoriaMetrics and VictoriaLogs MCPs.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: mcp-victoriametrics
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: mcp-victorialogs
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # The mail MCP and its new-mail check.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: imap-mcp
            app.kubernetes.io/name: imap-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: searxng
            app.kubernetes.io/name: searxng
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-webhook
spec:
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - name: webhook
      port: 8644
      targetPort: webhook
