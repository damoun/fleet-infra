# Chief of staff: plans the day and hands work to the other profiles.
# Sees family data: the main model and the side tasks that read the
# conversation run on the Claude subscription, not DeepSeek.
model:
  provider: claude-subscription-directsdk-experimental
  default: claude-sonnet-5-5
auxiliary:
  compression:
    provider: claude-subscription-directsdk-experimental
    model: claude-haiku-5-5
  title_generation:
    provider: claude-subscription-directsdk-experimental
    model: claude-haiku-5-5
plugins:
  enabled:
    - camofox
    - hermex-push
    - advanced-delegation
delegation:
  backend: profile_routes
  backends:
    profile_routes:
      profiles:
        - name: family
          description: Family and care admin, school, household paperwork and family finances.
        - name: content
          description: Social media content ideas, captions and planning.
        - name: vexa
          description: Building a game server hosting business from scratch.
        - name: ops
          description: Homelab operations, alert triage and fix suggestions.
