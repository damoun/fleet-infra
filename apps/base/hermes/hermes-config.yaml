_config_version: 51
timezone: Europe/Amsterdam
# V4 Pro plans and talks; delegated subtasks, where most tokens go, run on Flash.
model:
  provider: deepseek
  default: deepseek-v4-pro
delegation:
  model: deepseek-flash
auxiliary:
  compression:
    provider: deepseek
    model: deepseek-flash
  title_generation:
    provider: deepseek
    model: deepseek-flash
  # DeepSeek has no vision; images sent to Hermes are described by Gemini.
  vision:
    provider: gemini
    # 3.7 and 3.8 Flash took minutes per call on 2026-10-29; 3.6 answered in seconds.
    model: gemini-3.6-flash
    timeout: 30
    fallback_chain:
      - provider: gemini
        model: gemini-3.1-flash-lite
        timeout: 30
# 1M context and cheap cache hits: compress late to keep the cached prefix.
compression:
  threshold: 0.85
terminal:
  backend: ssh
  ssh_host: sandbox.hermes.svc.cluster.local
  ssh_port: 2222
  ssh_user: agent
  ssh_key: /opt/data/.ssh/id_ed25519
  cwd: "~"
approvals:
  mode: manual
browser:
  # The default Browser Use backend swaps the built-in tools for browser_exec,
  # which runs model-written Python inside the gateway. Keep the built-in
  # tools, which drive the camofox pod (anti-detection Firefox) over its REST API.
  backend: "off"
  cloud_provider: camofox
# With an ssh terminal, the default (auto) places the browser's screen in the
# sandbox and tries to start a desktop there. Browsing goes to the camofox pod;
# this keeps any local browser or desktop out of the sandbox.
bot_desktop:
  placement: gateway
agent:
  disabled_toolsets:
    - image_gen
    - tts
    # browser_exec, independent of browser.backend: resumed sessions keep their tool list.
    - browser-use
skills:
  write_approval: true
# Finances: read and categorize only. No deletes, transaction creation,
# imports, transfer, budget or goal edits.
mcp_servers:
  sure:
    url: http://mcp-auth.sure.svc.cluster.local:8080/mcp
    tools:
      include:
        - get_transactions
        - get_recurring_transactions
        - get_accounts
        - get_holdings
        - get_balance_sheet
        - get_income_statement
        - get_budget
        - get_tags
        - get_categories
        - get_merchants
        - get_rules
        - get_rule_options
        - preview_rule
        - get_transfer_match_candidates
        - update_transaction
        - create_category
        - update_category
        - create_tag
        - update_tag
        - create_rule
        - update_rule
        - apply_rule
  # Observability: read-only servers, so no tool filter.
  victoriametrics:
    url: http://mcp-victoriametrics.o11y.svc.cluster.local:8080/mcp
  victorialogs:
    url: http://mcp-victorialogs.o11y.svc.cluster.local:8081/mcp
  # Documents: the server drops deletes and admin tools, and the Paperless
  # user it runs as has no delete permission.
  paperless:
    url: http://mcp-auth.paperless.svc.cluster.local:8080/mcp
  # Bookmarks: everything except the delete tools.
  karakeep:
    url: http://karakeep-mcp.karakeep.svc.cluster.local:8000/mcp
    tools:
      include:
        - search-bookmarks
        - get-bookmark
        - get-bookmark-content
        - get-bookmark-lists
        - get-bookmark-highlights
        - get-asset
        - create-bookmark
        - update-bookmark
        - get-lists
        - get-list
        - get-list-bookmarks
        - create-list
        - update-list
        - add-bookmark-to-list
        - remove-bookmark-from-list
        - get-tags
        - get-tag
        - get-tag-bookmarks
        - update-tag
        - attach-tag-to-bookmark
        - detach-tag-from-bookmark
        - list-highlights
        - get-highlight
        - create-highlight
        - update-highlight
streaming:
  enabled: false
security:
  allow_lazy_installs: false
cron:
  allow_agent_scheduling: true
# Curated model picker; the DeepSeek models are set explicitly, and the fetch
# only produces proxy rejections.
model_catalog:
  enabled: false
dashboard:
  public_url: https://herm.core.ams.damoun.casa
  # Cilium's Envoy reaches the pod from an address in the pod CIDR.
  trusted_proxies:
    - 172.20.0.0/20
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://id.core.ams.damoun.casa
      # Public PKCE client; Pocket ID admits only hermes_admins.
      client_id: 94e1cd5c-8e11-43dd-b6ed-75f4a661d5ed
