---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-proxy-upstreams
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: egress-proxy
  egress:
    - toFQDNs:
        - matchName: api.deepseek.com
        - matchName: mcp.exa.ai
        - matchName: search.parallel.ai
        - matchName: api.firecrawl.dev
        - matchName: api.keenable.ai
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
