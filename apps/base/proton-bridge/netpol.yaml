---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: proton-bridge
  namespace: proton-bridge
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: proton-bridge
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: paperless
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "10143"
              protocol: TCP
  egressDeny:
    - toEntities:
        - kube-apiserver
  egress:
    # The Proton API only. Updates, TLS reports and alternative routing
    # through third-party proxies stay blocked.
    - toFQDNs:
        - matchName: mail-api.proton.me
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
