---
# Adds the MCP token so Hermes holds no credential. Its config (with the token)
# lives in the mcp-auth Secret and only exposes /mcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-auth
  namespace: sure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-auth
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine-slim@sha256:59678856b05324b7f6371f26eb1520be7fcd8bdc8ab380fc4913db8503e5a842
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: mcp-auth
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-auth
  namespace: sure
spec:
  selector:
    app.kubernetes.io/name: mcp-auth
  ports:
    - name: http
      port: 8080
      targetPort: http
