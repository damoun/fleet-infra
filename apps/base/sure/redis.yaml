---
# Sidekiq queue only: no persistence, no auth, reachable from the Sure pods alone.
# The chart's redisSimple lacks a container securityContext, which the
# restricted namespace rejects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-redis
  namespace: sure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sure-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure-redis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:7.2-alpine@sha256:3d2b46efa3280299fe6e117a33fccdfeb495c39098f95d076fadd12a88005b0a
          args:
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sure-redis
  namespace: sure
spec:
  selector:
    app.kubernetes.io/name: sure-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
