---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sure
  namespace: sure
spec:
  releaseName: sure
  interval: 1h
  chart:
    spec:
      chart: sure
      version: "0.7.6"
      sourceRef:
        kind: HelmRepository
        name: sure
        namespace: flux-system
  # The chart has no pod labels or hostAliases values.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: sure-web
            patch: |
              # Opts the web pod into Gateway traffic from the NetBird routers.
              - op: add
                path: /spec/template/metadata/labels/edge.damoun.casa~1exposed
                value: "true"
              # The Pocket ID issuer only resolves in NetBird DNS.
              - op: add
                path: /spec/template/spec/hostAliases
                value:
                  - ip: 172.28.0.10
                    hostnames:
                      - id.core.ams.damoun.casa
  values:
    image:
      repository: ghcr.io/we-promise/sure
      tag: 0.7.6@sha256:61cd4c1fa9917200f8db4434b45d968235f375c52cdbdc81bf4a4df555a2f090
    rails:
      existingSecret: sure
      settings:
        SELF_HOSTED: "true"
        ONBOARDING_STATE: closed
        POSTHOG_FEEDBACK_ENABLED: "false"
        # Passkeys bind to this ID; changing it later orphans registered keys.
        WEBAUTHN_RP_ID: sure.core.ams.damoun.casa
        WEBAUTHN_ALLOWED_ORIGINS: https://sure.core.ams.damoun.casa
        OIDC_ISSUER: https://id.core.ams.damoun.casa
        OIDC_REDIRECT_URI: https://sure.core.ams.damoun.casa/auth/openid_connect/callback
        OIDC_BUTTON_LABEL: Sign in with Pocket ID
        # Pocket ID only: no new accounts, no passwords.
        AUTH_JIT_MODE: link_only
        AUTH_LOCAL_LOGIN_ENABLED: "false"
        ALLOWED_OIDC_DOMAINS: plenard.me
      extraEnv:
        REDIS_URL: redis://sure-redis:6379/0
      extraEnvVars:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sure-db-app
              key: uri
        - name: MCP_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: sure
              key: MCP_API_TOKEN
        - name: MCP_USER_EMAIL
          valueFrom:
            secretKeyRef:
              name: sure
              key: MCP_USER_EMAIL
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: sure-oidc
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: sure-oidc
              key: OIDC_CLIENT_SECRET
    # The database is the CNPG Cluster in database.yaml, Redis is redis.yaml.
    cnpg:
      enabled: false
      cluster:
        enabled: false
    redisOperator:
      enabled: false
      managed:
        enabled: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    web:
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 1Gi
    worker:
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          memory: 1Gi
    migrations:
      job:
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 1Gi
