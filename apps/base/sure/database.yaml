---
# Primary + one replica on different workers: failover without a third copy.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sure-db
  namespace: sure
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:48a0038fdd9672d12853d5300666b2592f97f9d34a993ea42e3ecb5a9a5e43e3
  storage:
    storageClass: local
    size: 2Gi
  bootstrap:
    initdb:
      database: sure
      owner: sure
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
