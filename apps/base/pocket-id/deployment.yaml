---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: id
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
        edge.damoun.casa/exposed: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.19.1@sha256:f085157f0b6ea4b2e8aa5ecfd99eada0d83a4960f3a3dcfd46014097d0ef7ab5
          env:
            - name: APP_URL
              value: https://id.core.ams.damoun.casa
            - name: TRUST_PROXY
              value: "true"
            - name: FILE_BACKEND
              value: database
            - name: DB_CONNECTION_STRING_FILE
              value: /secrets/db/uri
            - name: ENCRYPTION_KEY_FILE
              value: /secrets/encryption/key
            - name: ANALYTICS_DISABLED
              value: "true"
            - name: VERSION_CHECK_DISABLED
              value: "true"
          ports:
            - name: http
              containerPort: 1411
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: db
              mountPath: /secrets/db
              readOnly: true
            - name: encryption
              mountPath: /secrets/encryption
              readOnly: true
            - name: data
              mountPath: /app/data
      volumes:
        - name: db
          secret:
            secretName: id-db-app
            items:
              - key: uri
                path: uri
        - name: encryption
          secret:
            secretName: pocket-id-encryption
        - name: data
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id
  namespace: id
spec:
  selector:
    app.kubernetes.io/name: pocket-id
  ports:
    - name: http
      port: 1411
      targetPort: http
