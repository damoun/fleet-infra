---
# Primary + one replica on different workers: failover without a third copy.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: id-db
  namespace: id
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:44d17e8570dc25055376148a2918840def5bef0193969be3e79101afa25eafc2
  storage:
    storageClass: local
    size: 2Gi
  bootstrap:
    initdb:
      database: pocketid
      owner: pocketid
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
