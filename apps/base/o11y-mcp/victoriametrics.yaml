---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-victoriametrics
  namespace: o11y
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-victoriametrics
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.20.2@sha256:bcbf84f945d6efb03fb8b2d2ccc3294420dccdc0b445752dce96f02619416dfe
          env:
            - name: MCP_SERVER_MODE
              value: http
            - name: MCP_LISTEN_ADDR
              value: ":8080"
            - name: VM_INSTANCE_ENTRYPOINT
              value: http://vmsingle-vm.o11y.svc.cluster.local:8428
            - name: VM_INSTANCE_TYPE
              value: single
            # Upstream defaults plus documentation, whose embedded vector database needs about 700Mi.
            - name: MCP_DISABLED_TOOLS
              value: export,flags,metric_relabel_debug,downsampling_filters_debug,retention_filters_debug,test_rules,documentation
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-victoriametrics
  namespace: o11y
spec:
  selector:
    app.kubernetes.io/name: mcp-victoriametrics
  ports:
    - name: http
      port: 8080
      targetPort: http
