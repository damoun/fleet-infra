---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection
  namespace: changedetection
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  namespace: changedetection
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: changedetection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changedetection
        edge.damoun.casa/exposed: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: changedetection
          image: ghcr.io/dgtlmoon/changedetection.io:0.70.2@sha256:36ebb3586e9a6b14af6fb488c6e29b60eceb79ee414ecdb6ac2b91dd25b1c7ba
          env:
            - name: BASE_URL
              value: https://diff.core.ams.damoun.casa
            # Trust the Gateway's X-Forwarded-* headers.
            - name: USE_X_SETTINGS
              value: "1"
            - name: PLAYWRIGHT_DRIVER_URL
              value: ws://sockpuppetbrowser:3000
            # The only phone-home: a check for a newer release.
            - name: DISABLE_VERSION_CHECK
              value: "true"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: datastore
              mountPath: /datastore
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: datastore
          persistentVolumeClaim:
            claimName: changedetection
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: changedetection
  namespace: changedetection
spec:
  selector:
    app.kubernetes.io/name: changedetection
  ports:
    - name: http
      port: 5000
      targetPort: http
