---
# Chrome for the pages that need JavaScript. It keeps no state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sockpuppetbrowser
  namespace: changedetection
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sockpuppetbrowser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sockpuppetbrowser
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sockpuppetbrowser
          image: docker.io/dgtlmoon/sockpuppetbrowser:latest@sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2
          env:
            # Chrome writes its profile under HOME.
            - name: HOME
              value: /tmp
          ports:
            - name: ws
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: ws
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sockpuppetbrowser
  namespace: changedetection
spec:
  selector:
    app.kubernetes.io/name: sockpuppetbrowser
  ports:
    - name: ws
      port: 3000
      targetPort: ws
