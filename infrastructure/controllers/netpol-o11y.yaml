---
# Lets VMAgent scrape metrics ports on every pod under default deny.
# Excludes kube-system like default-deny: selecting a pod with an ingress
# rule puts it in default-deny for ingress.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-vmagent-scrape
spec:
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: Exists
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8428"
              protocol: TCP
            - port: "8429"
              protocol: TCP
            - port: "9428"
              protocol: TCP
            - port: "9429"
              protocol: TCP
            - port: "9187"
              protocol: TCP
            - port: "9402"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmagent
  namespace: o11y
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8428"
              protocol: TCP
            - port: "8429"
              protocol: TCP
            - port: "9428"
              protocol: TCP
            - port: "9429"
              protocol: TCP
            - port: "9187"
              protocol: TCP
            - port: "9402"
              protocol: TCP
            - port: "9153"
              protocol: TCP
    # Host network: kubelet (cAdvisor, probes, resources), node-exporter,
    # Cilium agent, operator, Envoy and Hubble.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "9962"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9964"
              protocol: TCP
            - port: "9965"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmsingle
  namespace: o11y
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  # VMAgent's remote-write on 8428 is allowed by allow-vmagent-scrape.
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vlsingle
  namespace: o11y
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vlsingle
  # VMAgent's scrape on 9428 is allowed by allow-vmagent-scrape.
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
        - matchLabels:
            io.kubernetes.pod.namespace: o11y-node
            app.kubernetes.io/name: vlagent
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vlagent
  namespace: o11y-node
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vlagent
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: vlsingle
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-metrics-operator
  namespace: o11y
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-operator
  ingress:
    - fromEntities:
        - kube-apiserver
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: o11y
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vlsingle
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    # Plugin install (init container): grafana.com API, download redirects to GCS.
    - toFQDNs:
        - matchName: grafana.com
        - matchName: storage.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Token exchange with Pocket ID goes through the Gateway, and Cilium's Envoy
    # checks the client's egress against the backend pod.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: id
            app.kubernetes.io/name: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sync-job
  namespace: o11y
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: syncJob
  egress:
    # Dashboards and rules, pinned by commit in the HelmRelease values.
    - toFQDNs:
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
