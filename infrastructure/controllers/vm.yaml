---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm
  namespace: flux-system
spec:
  targetNamespace: o11y
  releaseName: vm
  interval: 1h
  # The operator's webhook certificate comes from cert-manager.
  dependsOn:
    - name: cert-manager
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
    namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # The stack copies the raw image tag into this label on VLSingle and VLAgent,
  # and tag@digest is not a valid label value.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: operator.victoriametrics.com
              kind: (VLSingle|VLAgent)
            patch: |
              - op: remove
                path: /metadata/labels/app.kubernetes.io~1version
  values:
    fullnameOverride: vm
    victoria-metrics-operator:
      image:
        repository: victoriametrics/operator
        tag: v0.75.1@sha256:97162bf8320b296f0361099f0290b9e035a3369e4022c5c42ca4a8146deca981
      configReloader:
        image:
          repository: victoriametrics/operator
          tag: config-reloader-v0.75.1@sha256:72d129e6a95edd3ee233cf11680c394baa2f75835f8cb978d3748dfb5eac87f2
      # Restricted-compatible securityContext on every pod the operator creates.
      env:
        - name: VM_ENABLESTRICTSECURITY
          value: "true"
        # Covers the config-reloader sidecar and the config-init init container.
        - name: VM_CONFIG_RELOADER_LIMIT_MEMORY
          value: 64Mi
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: medium
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 160Mi
      admissionWebhooks:
        certManager:
          enabled: true
      crds:
        cleanup:
          enabled: false
    syncJob:
      image:
        repository: ghcr.io/victoriametrics/sync-job
        tag: v0.0.17@sha256:b6f233532a85cda65e645264d24f995e5ee97f88b60610643f01f170516f444b
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    # The sync-job fetches these at install time; pin each to an immutable commit.
    # Renovate bumps tag and commit together (customManagers in renovate.json).
    defaultDashboards:
      sources:
        victoriametrics-single-node:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics tag=1.155.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/3db4e151429f6b864f906ac07ae7f5b9f54c09bd/dashboards/victoriametrics.json
        victoriametrics-vmagent:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics tag=1.155.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/3db4e151429f6b864f906ac07ae7f5b9f54c09bd/dashboards/vmagent.json
        victoriametrics-vmalert:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics tag=1.155.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/3db4e151429f6b864f906ac07ae7f5b9f54c09bd/dashboards/vmalert.json
        victoriametrics-operator:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics tag=1.155.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/3db4e151429f6b864f906ac07ae7f5b9f54c09bd/dashboards/operator.json
        kubernetes-views-global:
          # renovate: datasource=github-tags depName=dotdc/grafana-dashboards-kubernetes tag=v3.0.8
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/e4faf59e017a18e1b06fa64f11623bef15ce7507/dashboards/k8s-views-global.json
        kubernetes-views-namespaces:
          # renovate: datasource=github-tags depName=dotdc/grafana-dashboards-kubernetes tag=v3.0.8
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/e4faf59e017a18e1b06fa64f11623bef15ce7507/dashboards/k8s-views-namespaces.json
        kubernetes-views-pods:
          # renovate: datasource=github-tags depName=dotdc/grafana-dashboards-kubernetes tag=v3.0.8
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/e4faf59e017a18e1b06fa64f11623bef15ce7507/dashboards/k8s-views-pods.json
        kubernetes-views-nodes:
          # renovate: datasource=github-tags depName=dotdc/grafana-dashboards-kubernetes tag=v3.0.8
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/e4faf59e017a18e1b06fa64f11623bef15ce7507/dashboards/k8s-views-nodes.json
        kubernetes-system-api-server:
          # renovate: datasource=github-tags depName=dotdc/grafana-dashboards-kubernetes tag=v3.0.8
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/e4faf59e017a18e1b06fa64f11623bef15ce7507/dashboards/k8s-system-api-server.json
        kubernetes-system-coredns:
          # renovate: datasource=github-tags depName=dotdc/grafana-dashboards-kubernetes tag=v3.0.8
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/e4faf59e017a18e1b06fa64f11623bef15ce7507/dashboards/k8s-system-coredns.json
        node-exporter-full:
          # renovate: datasource=git-refs depName=https://github.com/rfmoz/grafana-dashboards tag=master
          url: https://raw.githubusercontent.com/rfmoz/grafana-dashboards/8b2b6e2b8b9ad6e146e2f2eeb303e9d04d0f815e/prometheus/node-exporter-full.json
        victorialogs-single-node:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaLogs tag=v1.53.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/915d91904bf7f5be66ab00f88947ae7fc1431acc/dashboards/victorialogs.json
        victorialogs-vlagent:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaLogs tag=v1.53.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/915d91904bf7f5be66ab00f88947ae7fc1431acc/dashboards/vlagent.json
        # Overlaps the dotdc views above.
        kube-prometheus:
          enabled: false
        flux-performance:
          # renovate: datasource=github-tags depName=controlplaneio-fluxcd/flux-operator tag=0.62.1
          url: https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/48e2cd76c475be87a1c9a8bd83fe07e064abd725/config/monitoring/dashboards/flux-performance.json
        flux-k8s-api-performance:
          # renovate: datasource=github-tags depName=controlplaneio-fluxcd/flux-operator tag=0.62.1
          url: https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/48e2cd76c475be87a1c9a8bd83fe07e064abd725/config/monitoring/dashboards/flux-k8s-api-performance.json
        cloudnative-pg:
          # renovate: datasource=github-tags depName=cloudnative-pg/grafana-dashboards tag=cluster-v0.0.5 versioning=regex:^cluster-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/cececeb393fb7c5400b4fa290aca68041293a127/charts/cluster/grafana-dashboard.json
    defaultRules:
      sources:
        alertmanager:
          # renovate: datasource=github-tags depName=prometheus-operator/kube-prometheus tag=v0.19.0
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/799f3d73b5adf5758c3119c9201d9f417accb6d0/manifests/alertmanager-prometheusRule.yaml
        kubernetes-control-plane:
          # renovate: datasource=github-tags depName=prometheus-operator/kube-prometheus tag=v0.19.0
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/799f3d73b5adf5758c3119c9201d9f417accb6d0/manifests/kubernetesControlPlane-prometheusRule.yaml
        kubernetes:
          # renovate: datasource=github-tags depName=prometheus-operator/kube-prometheus tag=v0.19.0
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/799f3d73b5adf5758c3119c9201d9f417accb6d0/manifests/kubePrometheus-prometheusRule.yaml
        kube-state-metrics:
          # renovate: datasource=github-tags depName=prometheus-operator/kube-prometheus tag=v0.19.0
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/799f3d73b5adf5758c3119c9201d9f417accb6d0/manifests/kubeStateMetrics-prometheusRule.yaml
        node-exporter:
          # renovate: datasource=github-tags depName=prometheus-operator/kube-prometheus tag=v0.19.0
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/799f3d73b5adf5758c3119c9201d9f417accb6d0/manifests/nodeExporter-prometheusRule.yaml
        vmhealth:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics tag=1.155.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/3db4e151429f6b864f906ac07ae7f5b9f54c09bd/deployment/docker/rules/alerts-health.yml
        vmagent:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics tag=1.155.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/3db4e151429f6b864f906ac07ae7f5b9f54c09bd/deployment/docker/rules/alerts-vmagent.yml
        vmalert:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics tag=1.155.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/3db4e151429f6b864f906ac07ae7f5b9f54c09bd/deployment/docker/rules/alerts-vmalert.yml
        vmsingle:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaMetrics tag=1.155.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/3db4e151429f6b864f906ac07ae7f5b9f54c09bd/deployment/docker/rules/alerts-single-node.yml
        vmoperator:
          # renovate: datasource=github-tags depName=VictoriaMetrics/operator tag=v0.75.1
          url: https://raw.githubusercontent.com/VictoriaMetrics/operator/444a18fcaa03e8ac9c8f706bd1f0b53629f1fb19/config/alerting/vmoperator-rules.yaml
        victorialogs:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaLogs tag=v1.53.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/915d91904bf7f5be66ab00f88947ae7fc1431acc/deployment/docker/rules/alerts-vlogs.yml
        vlagent:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaLogs tag=v1.53.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/915d91904bf7f5be66ab00f88947ae7fc1431acc/deployment/docker/rules/alerts-vlagent.yml
        vlhealth:
          # renovate: datasource=github-tags depName=VictoriaMetrics/VictoriaLogs tag=v1.53.0
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/915d91904bf7f5be66ab00f88947ae7fc1431acc/deployment/docker/rules/alerts-health.yml
    # Built-in Prometheus type only; the VictoriaMetrics plugin would be downloaded at start.
    defaultDatasources:
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: VictoriaMetrics
            isDefault: true
      # No plugin flag: the stack would otherwise skip it unless grafana.plugins
      # lists it, and that installs through the preinstall we turned off.
      # Grafana's install-plugins init container provides the plugin instead.
      victorialogs:
        datasources:
          - name: VictoriaLogs
            type: victoriametrics-logs-datasource
            access: proxy
            uid: VictoriaLogs
    vmsingle:
      spec:
        image:
          repository: victoriametrics/victoria-metrics
          tag: v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
        retentionPeriod: 14d
        priorityClassName: medium
        storage:
          storageClassName: local-retain
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
    vmagent:
      spec:
        image:
          repository: victoriametrics/vmagent
          tag: v1.155.0@sha256:8e3c03905be15bba8312d4868e8ae6f9fc2fefee0a41d544472034249ca42bb4
        priorityClassName: medium
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
    vlsingle:
      enabled: true
      spec:
        image:
          repository: victoriametrics/victoria-logs
          tag: v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
        retentionPeriod: 7d
        priorityClassName: medium
        storage:
          storageClassName: local-retain
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
    # Reads /var/log/pods on every node, so it runs in the privileged namespace.
    vlagent:
      enabled: true
      namespaceOverride: o11y-node
      spec:
        image:
          repository: victoriametrics/vlagent
          tag: v1.53.0@sha256:a82f93ffecc153fb068606903e512368b070272739d823abe99fad0eff6e1849
        priorityClassName: medium
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
    # The stack routes VMAlert queries through this proxy (LogsQL to VictoriaLogs,
    # the rest to VMSingle) whenever VMAlert, VMSingle and VLSingle all exist.
    internal:
      vmauth:
        spec:
          image:
            repository: victoriametrics/vmauth
            tag: v1.155.0@sha256:dfeb63e5eff4bc32ed0fa2d43d8e85b717e8442c8b5c753e83c216669665a7de
          priorityClassName: medium
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
    vmalert:
      spec:
        image:
          repository: victoriametrics/vmalert
          tag: v1.155.0@sha256:3256cba5ddaca5974eae6141105cec4ce37871f1c213f0a5c267ec0111bc68e1
        priorityClassName: medium
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
    alertmanager:
      spec:
        image:
          repository: quay.io/prometheus/alertmanager
          tag: v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
        # Credentials only, mounted at /etc/vm/secrets/alertmanager-notify/.
        secrets:
          - alertmanager-notify
        priorityClassName: medium
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
      templateFiles:
        pushover.tmpl: |-
          {{ define "dapl.pushover.title" -}}
          {{ if eq .Status "resolved" }}Resolved: {{ end }}{{ .CommonLabels.alertname }}{{ if gt (len .Alerts) 1 }} x{{ len .Alerts }}{{ end }}{{ with .CommonLabels.namespace }} · {{ . }}{{ end }}
          {{- end }}
          {{ define "dapl.pushover.message" -}}
          {{ range $i, $a := .Alerts }}{{ if lt $i 5 -}}
          <b>{{ or $a.Labels.pod $a.Labels.instance $a.Labels.node $a.Labels.job "cluster" }}</b> {{ or $a.Annotations.summary $a.Annotations.description $a.Annotations.message }}{{ with $a.Annotations.runbook_url }} <a href="{{ . }}">runbook</a>{{ end }}
          {{ end }}{{ end }}{{ if gt (len .Alerts) 5 }}and more in Grafana{{ end }}
          {{- end }}
      config:
        route:
          receiver: pushover
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            # Dead-man's switch: Watchdog always fires, healthchecks.io pages when the pings stop.
            - matchers: ['alertname = "Watchdog"']
              receiver: healthchecks
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 5m
            - matchers: ['alertname = "InfoInhibitor"']
              receiver: blackhole
            - matchers: ['severity = "info"']
              receiver: blackhole
            - matchers: ['severity = "critical"']
              receiver: pushover-critical
        inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity =~ "warning|info"']
            equal: [alertname, namespace]
          - source_matchers: ['alertname = "InfoInhibitor"']
            target_matchers: ['severity = "info"']
            equal: [namespace]
        receivers:
          - name: blackhole
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/vm/secrets/alertmanager-notify/hc-ping-url
                send_resolved: false
          - name: pushover
            pushover_configs:
              - user_key_file: /etc/vm/secrets/alertmanager-notify/pushover-user
                token_file: /etc/vm/secrets/alertmanager-notify/pushover-token
                title: '{{ template "dapl.pushover.title" . }}'
                message: '{{ template "dapl.pushover.message" . }}'
                html: true
                # Resolved notifications arrive silently.
                priority: '{{ if eq .Status "firing" }}0{{ else }}-1{{ end }}'
                url: https://graf.core.ams.damoun.casa/alerting/groups?alertmanager=Alertmanager
                url_title: Open in Grafana
          - name: pushover-critical
            pushover_configs:
              - user_key_file: /etc/vm/secrets/alertmanager-notify/pushover-user
                token_file: /etc/vm/secrets/alertmanager-notify/pushover-token
                title: '{{ template "dapl.pushover.title" . }}'
                message: '{{ template "dapl.pushover.message" . }}'
                html: true
                # Resolved notifications arrive silently.
                priority: '{{ if eq .Status "firing" }}1{{ else }}-1{{ end }}'
                url: https://graf.core.ams.damoun.casa/alerting/groups?alertmanager=Alertmanager
                url_title: Open in Grafana
    # Talos binds etcd, scheduler and controller-manager metrics to localhost.
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kube-state-metrics:
      # Its ClusterRole would otherwise read every Secret.
      collectorsExclude:
        - secrets
      image:
        registry: registry.k8s.io
        repository: kube-state-metrics/kube-state-metrics
        tag: v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
      priorityClassName: medium
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    prometheus-node-exporter:
      namespaceOverride: o11y-node
      # The scrape object stays in o11y and only looks in its own namespace by default.
      vmScrape:
        spec:
          namespaceSelector:
            matchNames:
              - o11y-node
      # The chart semver-checks image.tag, which fails on tag@digest; version takes precedence.
      version: 1.12.1
      image:
        registry: quay.io
        repository: prometheus/node-exporter
        tag: v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
      priorityClassName: medium
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi
    grafana:
      image:
        registry: docker.io
        repository: grafana/grafana
        tag: 13.2.4-distroless@sha256:ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35
      # Sidecars watch ConfigMaps in o11y only; no cluster-wide read on Secrets.
      rbac:
        namespaced: true
      sidecar:
        dashboards:
          searchNamespace: o11y
          resource: configmap
        datasources:
          searchNamespace: o11y
          resource: configmap
          # Write datasources before Grafana starts; the sidecar's reload call races startup.
          # Init-only: a datasource change needs a Grafana rollout restart.
          initDatasources: true
          # The init container uses watchMethod too; WATCH never exits.
          watchMethod: LIST
        image:
          registry: quay.io
          repository: kiwigrid/k8s-sidecar
          tag: 2.14.1@sha256:092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
      testFramework:
        enabled: false
      priorityClassName: medium
      # ~230Mi idle; dashboard loads went past 384Mi.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 768Mi
      # Plugins come from this pinned install, not Grafana's preinstall (turned off).
      # grafana cli checks the grafana.com checksum; Grafana checks the signature on load.
      extraInitContainers:
        - name: install-plugins
          image: docker.io/grafana/grafana:13.2.4-distroless@sha256:ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35
          command:
            - /usr/share/grafana/bin/grafana
            - cli
            - --pluginsDir
            - /var/lib/grafana/plugins
            - plugins
            - install
            - victoriametrics-logs-datasource
            - $(VICTORIALOGS_PLUGIN_VERSION)
          env:
            # renovate: datasource=github-releases depName=VictoriaMetrics/victorialogs-datasource
            - name: VICTORIALOGS_PLUGIN_VERSION
              value: "0.33.1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      podLabels:
        edge.damoun.casa/exposed: "true"
      # The OIDC issuer only resolves in NetBird DNS; reach it through the
      # private Gateway VIP so the issuer URL matches what browsers use.
      hostAliases:
        - ip: 172.28.0.10
          hostnames:
            - id.core.ams.damoun.casa
      envFromSecret: grafana-oidc
      grafana.ini:
        server:
          root_url: https://graf.core.ams.damoun.casa
        analytics:
          reporting_enabled: false
          check_for_updates: false
          check_for_plugin_updates: false
        news:
          news_feed_enabled: false
        security:
          disable_gravatar: true
        # Grafana installs default app plugins from grafana.com in the background.
        plugins:
          preinstall_disabled: true
        auth:
          disable_login_form: true
        auth.generic_oauth:
          enabled: true
          name: Pocket ID
          auto_login: true
          scopes: openid email profile groups
          auth_url: https://id.core.ams.damoun.casa/authorize
          token_url: https://id.core.ams.damoun.casa/api/oidc/token
          api_url: https://id.core.ams.damoun.casa/api/oidc/userinfo
          use_pkce: true
          role_attribute_path: contains(groups[*], 'grafana_admins') && 'Admin'
