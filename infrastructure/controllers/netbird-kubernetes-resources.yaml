---
apiVersion: netbird.io/v1
kind: NBResource
metadata:
  name: kubernetes-vip
  namespace: netbird
  finalizers:
    - netbird.io/cleanup
spec:
  # The control plane Layer-2 virtual IP, which is the Kubernetes API endpoint
  # (https://192.168.40.10:6443). It moves between control plane nodes on its own,
  # so a single route beats one route per node plus round-robin DNS.
  name: kubernetes-vip
  networkID: d6qsb42fadhs73cqhoi0
  address: 192.168.40.10/32
  policyName: Admin to Kubernetes
  tcpPorts:
    - 6443
  groups:
    - Kubernetes
