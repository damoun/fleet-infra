---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  targetNamespace: kube-system
  storageNamespace: kube-system
  releaseName: cilium
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.20.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  values:
    priorityClassName: critical
    policyAuditMode: false
    rollOutCiliumPods: true
    ipam:
      mode: kubernetes
    cluster:
      id: 1
      name: dapl-prd-hom-ams-core
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445
    routingMode: native
    autoDirectNodeRoutes: true
    ipv4NativeRoutingCIDR: 172.20.0.0/20
    encryption:
      enabled: true
      type: wireguard
    l2announcements:
      enabled: true
    gatewayAPI:
      enabled: true
    # Agent metrics; dashboards land in o11y for the Grafana sidecar.
    prometheus:
      enabled: true
    dashboards:
      enabled: true
      namespace: o11y
    operator:
      priorityClassName: critical
      rollOutPods: true
      dashboards:
        enabled: true
        namespace: o11y
    envoy:
      rollOutPods: true
    hubble:
      enabled: true
      relay:
        enabled: true
        priorityClassName: critical
      metrics:
        enabled:
          - dns
          - drop
          - policy
        dashboards:
          enabled: true
          namespace: o11y
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
  postRenderers:
    - kustomize:
        patches:
          # Needs httpV2 metrics, which only exist for traffic behind L7 policy.
          - target:
              kind: ConfigMap
              name: hubble-l7-http-metrics-by-workload
            patch: |
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: hubble-l7-http-metrics-by-workload
