---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  targetNamespace: kube-system
  releaseName: cilium
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.20.x"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  values:
    priorityClassName: critical
    ipam:
      mode: kubernetes
    cluster:
      id: 1
      name: dapl-prd-hom-ams-core
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445
    routingMode: native
    autoDirectNodeRoutes: true
    ipv4NativeRoutingCIDR: 172.20.0.0/20
    encryption:
      enabled: true
      type: wireguard
    l2announcements:
      enabled: true
    # Sized for <=10 LB services: QPS = services / leaseRenewDeadline, above the 5/10 default
    k8sClientRateLimit:
      qps: 10
      burst: 20
    gatewayAPI:
      enabled: true
    operator:
      priorityClassName: critical
    hubble:
      enabled: true
      relay:
        enabled: true
        priorityClassName: critical
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
