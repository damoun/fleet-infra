---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: netbird-rtr
  namespace: netbird
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rtr
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
  egress:
    - toFQDNs:
        - matchName: api.netbird.io
        - matchName: signal.netbird.io
        - matchName: relay.netbird.io
        - matchPattern: "*.relay.netbird.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP
    - toFQDNs:
        - matchName: stun.netbird.io
      toPorts:
        - ports:
            - port: "80"
              protocol: UDP
            - port: "443"
              protocol: UDP
            - port: "3478"
              protocol: UDP
            - port: "5555"
              protocol: UDP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "1"
              endPort: 65535
              protocol: UDP
    # Gateway traffic: Cilium's Envoy checks the client's egress against the backend
    # pod and port it picked (even in audit mode), so allow the opted-in backends.
    - toEndpoints:
        - matchLabels:
            edge.damoun.casa/exposed: "true"
          matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
