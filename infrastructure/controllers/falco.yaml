---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: flux-system
spec:
  targetNamespace: falco
  releaseName: falco
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: falco
    namespace: flux-system
  values:
    image:
      registry: docker.io
      repository: falcosecurity/falco
      tag: 0.45.1@sha256:69e957f91b3a6beb5c82e2afae33ec3e4479dab2d4421475d288d0cd113cedf6
    podPriorityClassName: high
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    driver:
      kind: modern_ebpf
    # The image ships the default rules and the container plugin, so nothing is downloaded.
    falcoctl:
      artifact:
        install:
          enabled: false
        follow:
          enabled: false
    collectors:
      containerEngine:
        engines:
          docker:
            enabled: false
          podman:
            enabled: false
          containerd:
            enabled: false
          cri:
            enabled: true
            sockets:
              - /run/containerd/containerd.sock
          lxc:
            enabled: false
          libvirt_lxc:
            enabled: false
          bpm:
            enabled: false
    # JSON on stdout: vlagent ships it to VictoriaLogs, where the VMRule below alerts on it.
    falco:
      json_output: true
      json_include_tags_property: false
      priority: notice
      syslog_output:
        enabled: false
      log_syslog: false
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: falco
  namespace: falco
spec:
  groups:
    - name: falco
      type: vlogs
      interval: 1m
      rules:
        - alert: FalcoEvent
          expr: >-
            _time:5m kubernetes.pod_namespace:falco priority:in(Warning, Error, Critical, Alert, Emergency)
            | stats by (rule, priority, output_fields.k8s.ns.name, output_fields.k8s.pod.name) count() as events
            | rename output_fields.k8s.ns.name as namespace, output_fields.k8s.pod.name as pod
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.rule }} ({{ $labels.priority }})"
