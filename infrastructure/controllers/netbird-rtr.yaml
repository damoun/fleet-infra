---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtr
  namespace: netbird
  labels:
    app.kubernetes.io/name: rtr
    app.kubernetes.io/part-of: netbird
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rtr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rtr
        app.kubernetes.io/part-of: netbird
    # NetBird needs root: Kubernetes only makes added capabilities effective for UID 0.
    spec: # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
      priorityClassName: high
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rtr
      containers:
        - name: netbird
          image: netbirdio/netbird:0.81.5@sha256:220974287a42cc2815a77d4fb662edb55a1bf32e6ed73a2ecfc6bde16b5043e1
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: rtr-setup-key
                  key: setup-key
            - name: NB_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NB_LOG_LEVEL
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
                - BPF
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rtr
  namespace: netbird
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rtr
