---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtr
  namespace: netbird
  labels:
    app.kubernetes.io/name: rtr
    app.kubernetes.io/part-of: netbird
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rtr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rtr
        app.kubernetes.io/part-of: netbird
    spec:
      priorityClassName: high
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rtr
      containers:
        - name: netbird
          image: netbirdio/netbird:0.81.3@sha256:f8a4ea01da9f2351d5c9436209ee9caf35dd118fc9c1fc2ce7859f0c6e44781c
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: rtr-setup-key
                  key: setup-key
            - name: NB_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NB_LOG_LEVEL
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
                - BPF
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rtr
  namespace: netbird
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rtr
