---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-digest
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    # Talos runs these from its own tags, versioned by kubernetes_version in tofu/baremetal.
    - name: unpinned
      expression: >-
        variables.containers.filter(c, !c.image.contains('@sha256:') &&
        !(request.namespace == 'kube-system' &&
        c.image.matches('^registry\\.k8s\\.io/(kube-apiserver|kube-controller-manager|kube-scheduler|coredns/coredns):[^@]+$')))
  validations:
    - expression: "size(variables.unpinned) == 0"
      messageExpression: >-
        'images must be pinned by digest: ' +
        variables.unpinned.map(c, c.image).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-digest
spec:
  policyName: image-digest
  validationActions: [Deny, Audit]
