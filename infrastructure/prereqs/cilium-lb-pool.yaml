---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab
spec:
  blocks:
    - start: 192.168.40.200
      stop: 192.168.40.250
  serviceSelector:
    matchExpressions:
      - key: lb.damoun.casa/pool
        operator: NotIn
        values:
          - priv
---
# Never announced on the LAN: only reachable from inside the cluster, i.e. through the NetBird routers.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: priv
spec:
  blocks:
    - cidr: 172.28.0.0/28
  serviceSelector:
    matchLabels:
      lb.damoun.casa/pool: priv
