---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager-webhook-bunny
  namespace: flux-system
spec:
  interval: 24h
  url: oci://ghcr.io/aardbol/charts/cert-manager-webhook-bunny
  ref:
    tag: 1.4.3
    digest: sha256:21698e4b24a5a48249d6030a1e8069898767028d6df1a323f5c1f060752907ad
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        # Signed by a shared reusable workflow, called by aardbol pinned to a commit SHA.
        subject: ^https://github\.com/upcloud-tools/gha-actions/\.github/workflows/release-helm-chart\.yaml@[0-9a-f]{40}$
