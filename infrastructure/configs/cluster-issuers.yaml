---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - selector:
          dnsZones:
            - damoun.casa
        dns01:
          webhook:
            groupName: acme.damoun.casa
            solverName: bunny
            config:
              secretRef: bunny-api-key
              secretNamespace: cert-manager
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - selector:
          dnsZones:
            - damoun.casa
        dns01:
          webhook:
            groupName: acme.damoun.casa
            solverName: bunny
            config:
              secretRef: bunny-api-key
              secretNamespace: cert-manager
