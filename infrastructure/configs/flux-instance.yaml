---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    # Exact pin bumped by Renovate. The operator only installs versions from its own
    # catalog, so a new Flux minor may need a flux-operator chart bump first.
    # renovate: datasource=github-releases depName=fluxcd/flux2
    version: "2.10.0"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  sync:
    kind: GitRepository
    url: ssh://git@github.com/damoun/fleet-infra
    ref: refs/heads/main
    path: clusters/dapl-prd-hom-ams-core
    pullSecret: flux-system
  # Re-check a dependency that is still reconciling after 5s instead of 30s, so a
  # merge walks the layer chain without stalling on each dependsOn.
  kustomize:
    patches:
      - target:
          kind: Deployment
          name: (kustomize-controller|helm-controller)
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
